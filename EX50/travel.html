<html>
<head>
    <title>Travel Expense Report</title>
    <style>
        body {
            background-color: white;
            font-family: "Times New Roman", serif;
            font-size: 12px;
        }
        #container {
            width: 540px;
            height: 525px;
            margin: auto;
            padding: 10px;
            background-color: #ccffff;
            border: 2px solid blue;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        .logo {
            display: block;
            width: 340px;
            height: auto;
            margin: 0 auto 15px auto;
        }
        h2 {
            font-size: 16px;
            margin-top: 5px;
        }
        hr {
            border: 0;
            border-top: 1px solid gray;
            margin: 12px 0;
        }

        form {
            width: 520px;
            margin: auto;
        }

        .row {
            margin: 10px 0;
        }

        input[type="text"] {
            height: 15px;
        }

        .firstname {
            width: 130px;
        }

        .lastname {
            width: 85px;
        }

        .social {
            width: 80px;
        }

        textarea {
            width: 330px;
            height: 45px;
            resize: none;
        }

        select {
            font-size: 11px;
        }

        table {
            border-collapse: collapse;
            width: 435px;
            margin-top: 8px;
        }

        th,
        td {
            border: 1px solid gray;
            padding: 2px;
        }

        th {
            text-align: center;
            background-color: #e5ffff;
        }

        .date {
            width: 55px;
        }

        .description {
            width: 125px;
        }

        .category {
            width: 75px;
        }

        .amount {
            width: 40px;
        }

        .submit-area {
            margin-top: 12px;
        }

        .submit-area input {
            font-size: 10px;
        }

        .contact {
            margin-top: 12px;
        }
    </style>
</head>
<body>
<form onsubmit="return false;">
    <div id="container">
        <img
            src="hinh/DeLong.jpg"
            class="logo"
        >
        <h2>Travel Expense Report</h2>
        <hr>
        <div class="row">
            <b>1) First Name:</b>
            <input
                type="text"
                class="firstname"
            >
            <b>Last Name:</b>
            <input
                type="text"
                class="lastname"
            >
        </div>
        <div class="row">
            <b>2) Social Security Number:</b>
            <input
                type="text"
                class="social"
            >
        </div>
        <div class="row">
            <b>3) Department:</b>
            <select>
                <option>Accounting</option>
                <option>Marketing</option>
                <option>Human Resources</option>
                <option>Information Technology</option>
                <option>Sales</option>
            </select>
        </div>
        <div class="row">
            <b>4) Describe the purpose of your trip.</b>
            <br><br>
            <textarea></textarea>
        </div>
        <div class="row">
            <b>5) Itemize your travel expenses</b>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
                <tr>
                    <td>
                        <input
                            type="text"
                            class="date"
                            placeholder="mm/dd/yy"
                        >
                    </td>
                    <td>
                        <input
                            type="text"
                            class="description"
                        >
                    </td>
                    <td>
                        <select class="category">
                            <option>Meal</option>
                            <option>Hotel</option>
                            <option>Airfare</option>
                            <option>Taxi</option>
                            <option>Other</option>
                        </select>
                    </td>
                    <td>
                        <input
                            type="text"
                            class="amount"
                        >
                    </td>
                </tr>
                <tr>
                    <td>
                        <input
                            type="text"
                            class="date"
                            placeholder="mm/dd/yy"
                        >
                    </td>
                    <td>
                        <input
                            type="text"
                            class="description"
                        >
                    </td>

                    <td>

                        <select class="category">

                            <option>Meal</option>
                            <option>Hotel</option>
                            <option>Airfare</option>
                            <option>Taxi</option>
                            <option>Other</option>

                        </select>

                    </td>

                    <td>
                        <input
                            type="text"
                            class="amount"
                        >
                    </td>

                </tr>


                <tr>

                    <td>
                        <input
                            type="text"
                            class="date"
                            placeholder="mm/dd/yy"
                        >
                    </td>

                    <td>
                        <input
                            type="text"
                            class="description"
                        >
                    </td>

                    <td>

                        <select class="category">

                            <option>Meal</option>
                            <option>Hotel</option>
                            <option>Airfare</option>
                            <option>Taxi</option>
                            <option>Other</option>

                        </select>

                    </td>

                    <td>
                        <input
                            type="text"
                            class="amount"
                        >
                    </td>

                </tr>


                <tr>

                    <td>
                        <input
                            type="text"
                            class="date"
                            placeholder="mm/dd/yy"
                        >
                    </td>

                    <td>
                        <input
                            type="text"
                            class="description"
                        >
                    </td>

                    <td>

                        <select class="category">

                            <option>Meal</option>
                            <option>Hotel</option>
                            <option>Airfare</option>
                            <option>Taxi</option>
                            <option>Other</option>

                        </select>

                    </td>

                    <td>
                        <input
                            type="text"
                            class="amount"
                        >
                    </td>

                </tr>

            </table>

        </div>


        <!-- 6. RECEIPTS -->

        <div class="row">

            <b>6) Have you submitted your receipts?</b>

            <input
                type="radio"
                name="receipts"
            >
            Yes

            <input
                type="radio"
                name="receipts"
            >
            No

        </div>


        <!-- BUTTONS -->

        <div class="submit-area">

            <input
                type="button"
                value="Submit travel expenses"
                onclick="alert('Submit thành công!')"
            >

            <input
                type="reset"
                value="Reset"
            >

        </div>


        <!-- CONTACT -->

        <div class="contact">

            Questions? Contact Debbie Larson in Accounting
            (ext. 2150).

        </div>


    </div>

</form>


</body>

</html>
